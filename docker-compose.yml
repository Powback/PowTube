services:
  # iSponsorBlockTV — auto-skips YouTube sponsor segments on smart TVs
  # Connects to YouTube TV via Lounge API (pairing code on TV, NOT Jellyfin)
  # First-time setup: docker exec -it isponsorblock python main.py --setup
  # Or use the pairing helper: ../PowStation/scripts/isponsorblock-pair.sh <tv-pairing-code>
  # Note: network_mode host needed for SSDP/mDNS TV auto-discovery;
  #       under Colima, manual pairing via TV pairing code is recommended instead
  isponsorblock:
    build: ./src/isponsorblock-fork
    container_name: isponsorblock
    restart: unless-stopped
    volumes:
      - ./data/isponsorblock:/app/data
    ports:
      - "7654:7654"
    environment:
      - TZ=Europe/Amsterdam
