services:
  # iSponsorBlockTV — auto-skips YouTube sponsor segments on smart TVs
  # Connects to YouTube TV via Lounge API (pairing code on TV, NOT Jellyfin)
  # First-time setup: docker exec -it isponsorblock python main.py --setup
  # Or use the pairing helper: ../PowStation/scripts/isponsorblock-pair.sh <tv-pairing-code>
  # Note: network_mode host needed for SSDP/mDNS TV auto-discovery;
  #       under Colima, manual pairing via TV pairing code is recommended instead
  isponsorblock:
    build: ./src/isponsorblock
    container_name: isponsorblock
    restart: unless-stopped
    volumes:
      - ./data/isponsorblock:/app/data
    ports:
      - "7654:7654"
    environment:
      - TZ=Europe/Amsterdam

  # Chromecast control server — cast media to Chromecast/Google Cast devices
  # Connects to TV directly by IP (no mDNS needed under Colima)
  # Usage: ./chromecast-cli <command>   (from host, via port 7655)
  chromecast:
    build: ./src/chromecast
    container_name: chromecast
    restart: unless-stopped
    ports:
      - "7655:7655"
    environment:
      - TZ=Europe/Amsterdam
      - CHROMECAST_HOST=192.168.50.143
      - CHROMECAST_CONTROL_PORT=7655
    # network_mode: host  # Uncomment if mDNS device discovery needed (not required for direct IP)
